model:
  arch: timechat
  model_type: pretrain_llama_v2
  freeze_vit: True
  freeze_qformer: False


  # Q-Former
  num_query_token: 32

  vit_model: "ckpt/eva-vit-g/eva_vit_g.pth"
  llama_model: "ckpt/Video-LLaMA-2-7B-Finetuned/llama-2-7b-chat-hf/"
  q_former_model: "ckpt/instruct-blip/instruct_blip_vicuna7b_trimmed.pth"
  ckpt: "ckpt/Video-LLaMA-2-7B-Finetuned/VL_LLaMA_2_7B_Finetuned.pth"


  # only train vision branch
  frozen_llama_proj: False
  frozen_video_Qformer: False

  fusion_head_layers: 2
  max_frame_pos: 96
  fusion_header_type: "seqTransf"

  max_txt_len: 2048

  # for llama_2_chat:
  end_sym: "</s>"
  prompt_path: ""
  prompt_template: '[INST] <<SYS>>\n \n<</SYS>>\n\n{} [/INST] '

  use_grad_checkpoint: True
  lora: True
  lora_inference_mode: False
  qformer_text_input: True
  window_size: 32
  stride: 32
  max_time_token: 600

datasets:
  charades_instruct:
    sample_ratio: 6
    build_info:
      anno_dir: "data/token600/charades_1000_token600.json"
    vis_processor:
      train:
        n_frms: 16 # 96
      eval:
        n_frms: 16 # 96
    num_frm: 16 # 96 

  didemo_instruct:
    sample_ratio: 1
    build_info:
      anno_dir: "data/token600/didemo_1000_token600.json"
    vis_processor:
      train:
        n_frms: 16 # 96
      eval:
        n_frms: 16 # 96
    num_frm: 16 # 96 

  activitynet_instruct:
    sample_ratio: 3
    build_info:
      anno_dir: "data/token600/activitynet_1000_token600.json"
    vis_processor:
      train:
        n_frms: 16 # 96
      eval:
        n_frms: 16 # 96
    num_frm: 16 # 96 

run:
  task: video_text_pretrain
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 3e-5
  min_lr: 1e-5
  warmup_lr: 1e-6

  weight_decay: 0.05
  max_epoch: 2
  iters_per_epoch: 20  # data_size/(batch_size*gpu_num) 可以控制使用多少数据
  batch_size_train: 1
  batch_size_eval: 4
  num_workers: 6
  warmup_steps: 18  # iters_per_epoch*0.6
  accum_grad_iters: 4

  seed: 42
  output_dir: "ckpt/timechat/test"

  amp: True
  resume_ckpt_path: null

  evaluate: False 
  train_splits: ["train"]
  # valid_splits: ["val"]
  # test_splits: ["test"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
